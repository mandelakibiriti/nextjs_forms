name: UAT Deploy

on:
  push:
    branches:
      - uat
      - main
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy (default: branch-sha)"
        required: false
        default: ""

# Only one UAT deploy runs at a time
concurrency:
  group: uat-deploy
  cancel-in-progress: false

# Permissions needed for GHCR push + GitHub Pages OIDC deploy
permissions:
  contents: read
  packages: write
  pages: write
  id-token: write

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}/nextjs_forms
  NODE_VERSION: "22"
  PNPM_VERSION: "9.15.0"

jobs:
  # ─── 1. Lint & Type-check ─────────────────────────────────────────────────
  lint:
    name: Lint & Type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build schema-core
        run: pnpm --filter @formforge/schema-core build

      # sdk-react must be compiled before the builder can resolve its types
      - name: Build sdk-react
        run: pnpm --filter @formforge/react build

      - name: Type-check API
        run: pnpm --filter @formforge/api lint

      - name: Type-check Builder
        run: pnpm --filter @formforge/builder lint

      - name: Type-check SDK React
        run: pnpm --filter @formforge/react lint

  # ─── 2. Build & Push Docker images ───────────────────────────────────────
  build-images:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: lint

    outputs:
      image_tag: ${{ steps.meta.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Compute image tag: manual input → branch slug + sha
      - name: Compute image tag
        id: meta
        run: |
          if [ -n "${{ github.event.inputs.image_tag }}" ]; then
            TAG="${{ github.event.inputs.image_tag }}"
          else
            BRANCH="${GITHUB_REF_NAME//\//-}"
            SHA="${GITHUB_SHA::8}"
            TAG="${BRANCH}-${SHA}"
          fi
          echo "version=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Image tag: ${TAG}"

      # ── API image ──
      - name: Build & push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/formforge-api:${{ steps.meta.outputs.version }}
            ${{ env.REGISTRY }}/formforge-api:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      # ── Builder UI Docker image ──
      - name: Build & push Builder image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.builder
          push: true
          tags: |
            ${{ env.REGISTRY }}/formforge-builder:${{ steps.meta.outputs.version }}
            ${{ env.REGISTRY }}/formforge-builder:latest
          build-args: |
            VITE_API_URL=${{ vars.UAT_API_URL || 'http://localhost:3001' }}
          cache-from: type=gha,scope=builder
          cache-to: type=gha,mode=max,scope=builder

  # ─── 3. Deploy Builder UI → GitHub Pages (always runs, no server needed) ─
  deploy-pages:
    name: Deploy Builder UI → GitHub Pages
    runs-on: ubuntu-latest
    needs: lint
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build schema-core
        run: pnpm --filter @formforge/schema-core build

      - name: Build React SDK
        run: pnpm --filter @formforge/react build

      # Build SPA with base path = /nextjs_forms/ (GitHub Pages subdirectory)
      # VITE_API_URL falls back to empty string — API-dependent features show
      # a "connect your API" prompt instead of failing silently.
      - name: Build Builder SPA for GitHub Pages
        env:
          VITE_BASE_PATH: /nextjs_forms/
          VITE_API_URL: ${{ vars.UAT_API_URL || '' }}
        run: pnpm --filter @formforge/builder build

      # SPA fallback: GitHub Pages serves 404.html when a sub-route is
      # requested directly. Copying index.html → 404.html re-routes all
      # 404s through the React router, enabling deep-link sharing.
      - name: Add SPA 404 fallback
        run: cp apps/builder/dist/index.html apps/builder/dist/404.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/builder/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # ─── 4. Gate job: reads UAT_SSH_HOST secret → emits boolean output ─────────
  # Secrets cannot be used in job-level `if:` expressions, so we check inside
  # a `run` step (where they are allowed) and expose the result as an output.
  check-secrets:
    name: Check UAT Server Secrets
    runs-on: ubuntu-latest
    outputs:
      has_uat_server: ${{ steps.check.outputs.has_uat_server }}
    steps:
      - name: Detect UAT_SSH_HOST
        id: check
        env:
          UAT_SSH_HOST: ${{ secrets.UAT_SSH_HOST }}
        run: |
          if [ -n "$UAT_SSH_HOST" ]; then
            echo "has_uat_server=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_uat_server=false" >> "$GITHUB_OUTPUT"
          fi

  # ─── 5. Deploy Full Stack → UAT server (only if SSH secrets configured) ──
  deploy-uat:
    name: Deploy Full Stack → UAT Server
    runs-on: ubuntu-latest
    needs: [build-images, check-secrets]
    if: needs.check-secrets.outputs.has_uat_server == 'true'
    environment:
      name: uat
      url: ${{ vars.UAT_APP_URL }}

    steps:
      - uses: actions/checkout@v4

      - name: Copy compose files to UAT server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.UAT_SSH_HOST }}
          username: ${{ secrets.UAT_SSH_USER }}
          key: ${{ secrets.UAT_SSH_KEY }}
          port: ${{ secrets.UAT_SSH_PORT || 22 }}
          source: "docker-compose.yml,docker-compose.uat.yml"
          target: "/opt/formforge"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_TAG: ${{ needs.build-images.outputs.image_tag }}
          DATABASE_URL: ${{ secrets.UAT_DATABASE_URL }}
          JWT_SECRET: ${{ secrets.UAT_JWT_SECRET }}
          JWT_EXPIRES_IN: "7d"
          REDIS_URL: ${{ secrets.UAT_REDIS_URL }}
          API_BASE_URL: ${{ vars.UAT_API_URL }}
        with:
          host: ${{ secrets.UAT_SSH_HOST }}
          username: ${{ secrets.UAT_SSH_USER }}
          key: ${{ secrets.UAT_SSH_KEY }}
          port: ${{ secrets.UAT_SSH_PORT || 22 }}
          envs: REGISTRY,IMAGE_TAG,DATABASE_URL,JWT_SECRET,JWT_EXPIRES_IN,REDIS_URL,API_BASE_URL
          script: |
            set -e
            cd /opt/formforge

            echo "==> Logging in to GHCR..."
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            echo "==> Pulling new images (tag: ${IMAGE_TAG})..."
            docker compose -f docker-compose.yml -f docker-compose.uat.yml pull api builder

            echo "==> Rolling restart..."
            docker compose -f docker-compose.yml -f docker-compose.uat.yml up -d \
              --remove-orphans \
              --wait \
              --wait-timeout 120

            echo "==> Pruning old images..."
            docker image prune -f --filter "until=24h"

            echo "==> UAT deployment complete!"
            docker compose -f docker-compose.yml -f docker-compose.uat.yml ps

      - name: Verify API health
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.UAT_SSH_HOST }}
          username: ${{ secrets.UAT_SSH_USER }}
          key: ${{ secrets.UAT_SSH_KEY }}
          port: ${{ secrets.UAT_SSH_PORT || 22 }}
          script: |
            echo "==> Checking API health..."
            for i in $(seq 1 10); do
              STATUS=$(curl -sf http://localhost:3001/health | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('status',''))" 2>/dev/null || echo "")
              if [ "$STATUS" = "ok" ]; then
                echo "  API is healthy"
                exit 0
              fi
              echo "  Attempt $i/10 — waiting..."
              sleep 5
            done
            echo "  API health check failed"
            exit 1

  # ─── 6. Deployment Summary ────────────────────────────────────────────────
  summary:
    name: Deployment Summary
    runs-on: ubuntu-latest
    needs: [build-images, deploy-pages]
    if: always()

    steps:
      - name: Write job summary
        run: |
          TAG="${{ needs.build-images.outputs.image_tag }}"
          REGISTRY="${{ env.REGISTRY }}"

          echo "## FormForge UAT Deployment" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Lint & Type-check | ${{ needs.lint.result || 'skipped' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Docker images (GHCR) | ${{ needs.build-images.result || 'skipped' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Builder UI (GitHub Pages) | ${{ needs.deploy-pages.result || 'skipped' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Docker Images" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "${REGISTRY}/formforge-api:${TAG}" >> $GITHUB_STEP_SUMMARY
          echo "${REGISTRY}/formforge-builder:${TAG}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Run the full stack locally" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "REGISTRY=${REGISTRY} IMAGE_TAG=${TAG} \\" >> $GITHUB_STEP_SUMMARY
          echo "  DATABASE_URL=postgresql://postgres:password@localhost:5432/formforge \\" >> $GITHUB_STEP_SUMMARY
          echo "  JWT_SECRET=\$(openssl rand -hex 32) \\" >> $GITHUB_STEP_SUMMARY
          echo "  REDIS_URL=redis://localhost:6379 \\" >> $GITHUB_STEP_SUMMARY
          echo "  docker compose -f docker-compose.yml -f docker-compose.uat.yml up -d" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
