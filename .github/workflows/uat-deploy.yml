name: UAT Deploy

on:
  push:
    branches:
      - uat
      - main
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy (default: sha of HEAD)"
        required: false
        default: ""

# Only one UAT deploy runs at a time
concurrency:
  group: uat-deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}/nextjs_forms
  NODE_VERSION: "22"
  PNPM_VERSION: "9.15.0"

jobs:
  # ─── 1. Lint & Type-check ─────────────────────────────────────────────────
  lint:
    name: Lint & Type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build schema-core (required for dependent packages)
        run: pnpm --filter @formforge/schema-core build

      - name: Type-check API
        run: pnpm --filter @formforge/api lint

      - name: Type-check Builder
        run: pnpm --filter @formforge/builder lint

      - name: Type-check SDK React
        run: pnpm --filter @formforge/react lint

  # ─── 2. Build & Push Docker images ───────────────────────────────────────
  build-images:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: lint
    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.meta.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Compute image tag: input override → branch slug + sha
      - name: Compute image tag
        id: meta
        run: |
          if [ -n "${{ github.event.inputs.image_tag }}" ]; then
            TAG="${{ github.event.inputs.image_tag }}"
          else
            BRANCH="${GITHUB_REF_NAME//\//-}"
            SHA="${GITHUB_SHA::8}"
            TAG="${BRANCH}-${SHA}"
          fi
          echo "version=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Image tag: ${TAG}"

      # ── API image ──
      - name: Build & push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/formforge-api:${{ steps.meta.outputs.version }}
            ${{ env.REGISTRY }}/formforge-api:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      # ── Builder UI image ──
      - name: Build & push Builder image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.builder
          push: true
          tags: |
            ${{ env.REGISTRY }}/formforge-builder:${{ steps.meta.outputs.version }}
            ${{ env.REGISTRY }}/formforge-builder:latest
          build-args: |
            VITE_API_URL=${{ vars.UAT_API_URL || 'http://localhost:3001' }}
          cache-from: type=gha,scope=builder
          cache-to: type=gha,mode=max,scope=builder

  # ─── 3. Deploy to UAT ─────────────────────────────────────────────────────
  deploy-uat:
    name: Deploy to UAT
    runs-on: ubuntu-latest
    needs: build-images
    environment:
      name: uat
      url: ${{ vars.UAT_APP_URL }}

    steps:
      - uses: actions/checkout@v4

      - name: Copy compose files to UAT server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.UAT_SSH_HOST }}
          username: ${{ secrets.UAT_SSH_USER }}
          key: ${{ secrets.UAT_SSH_KEY }}
          port: ${{ secrets.UAT_SSH_PORT || 22 }}
          source: "docker-compose.yml,docker-compose.uat.yml"
          target: "/opt/formforge"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_TAG: ${{ needs.build-images.outputs.image_tag }}
          DATABASE_URL: ${{ secrets.UAT_DATABASE_URL }}
          JWT_SECRET: ${{ secrets.UAT_JWT_SECRET }}
          JWT_EXPIRES_IN: "7d"
          REDIS_URL: ${{ secrets.UAT_REDIS_URL }}
          API_BASE_URL: ${{ vars.UAT_API_URL }}
        with:
          host: ${{ secrets.UAT_SSH_HOST }}
          username: ${{ secrets.UAT_SSH_USER }}
          key: ${{ secrets.UAT_SSH_KEY }}
          port: ${{ secrets.UAT_SSH_PORT || 22 }}
          envs: REGISTRY,IMAGE_TAG,DATABASE_URL,JWT_SECRET,JWT_EXPIRES_IN,REDIS_URL,API_BASE_URL
          script: |
            set -e
            cd /opt/formforge

            echo "==> Logging in to GHCR..."
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            echo "==> Pulling new images (tag: ${IMAGE_TAG})..."
            docker compose -f docker-compose.yml -f docker-compose.uat.yml pull api builder

            echo "==> Deploying with zero-downtime rolling restart..."
            docker compose -f docker-compose.yml -f docker-compose.uat.yml up -d \
              --remove-orphans \
              --wait \
              --wait-timeout 120

            echo "==> Pruning old images..."
            docker image prune -f --filter "until=24h"

            echo "==> UAT deployment complete!"
            docker compose -f docker-compose.yml -f docker-compose.uat.yml ps

      - name: Verify deployment health
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.UAT_SSH_HOST }}
          username: ${{ secrets.UAT_SSH_USER }}
          key: ${{ secrets.UAT_SSH_KEY }}
          port: ${{ secrets.UAT_SSH_PORT || 22 }}
          script: |
            echo "==> Checking API health..."
            for i in $(seq 1 10); do
              STATUS=$(curl -sf http://localhost:3001/health | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('status',''))" 2>/dev/null || echo "")
              if [ "$STATUS" = "ok" ]; then
                echo "  API is healthy"
                exit 0
              fi
              echo "  Attempt $i/10 — waiting..."
              sleep 5
            done
            echo "  API health check failed after 10 attempts"
            exit 1
