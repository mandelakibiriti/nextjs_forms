name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - claude/**

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "9.15.0"

jobs:
  lint-and-build:
    name: Lint, Type-check & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build schema-core
        run: pnpm --filter @formforge/schema-core build

      - name: Build SDK React
        run: pnpm --filter @formforge/react build

      - name: Type-check API
        run: pnpm --filter @formforge/api lint

      - name: Type-check Builder
        run: pnpm --filter @formforge/builder lint

      - name: Generate Drizzle migrations (schema validation)
        run: pnpm --filter @formforge/api db:generate
        env:
          DATABASE_URL: postgresql://placeholder/placeholder

      - name: Upload migration artifacts
        uses: actions/upload-artifact@v4
        with:
          name: drizzle-migrations
          path: apps/api/drizzle/migrations/
          retention-days: 7

  docker-build-check:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: lint-and-build

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          cache-from: type=gha,scope=api-ci
          cache-to: type=gha,mode=max,scope=api-ci

      - name: Build Builder image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.builder
          push: false
          cache-from: type=gha,scope=builder-ci
          cache-to: type=gha,mode=max,scope=builder-ci
